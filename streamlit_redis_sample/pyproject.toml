[project]
name = "streamlit-redis-map"
version = "0.1.0"
description = "Taiwan Population Map with Streamlit and Redis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.30.0",
    "redis>=5.0.0",
    "pandas>=2.0.0",
    "pydeck>=0.8.0",
    "numpy>=1.24.0",
    "python-geohash>=0.8.5",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]
